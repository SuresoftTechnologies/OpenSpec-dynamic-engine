schema: engine-spec-driven

context: |
  dynamic-engine 팀 OpenSpec 문서는 한글로 작성한다.
  영문을 직역한 번역투를 피하고 사람이 읽기 쉬운 자연스러운 한국어로 작성한다.
  첫 문단에는 결론과 필요한 이유를 먼저 두고, 배경과 세부 근거는 그 뒤에 둔다.
  문장은 짧게 쓰고 한 문단에 여러 논점을 섞지 않는다.
  command, code identifier, config key, path, OpenSpec parser keyword는 원문을 유지할 수 있다.
  구현 작업은 테스트 우선으로 진행하고, 테스트 의도와 기대 동작을 구현 전에 정리한다.
  테스트 목적/동작과 중요한 로직/함수에는 한글 주석을 작성한다.
  구현과 테스트 통과가 끝난 뒤에만 task를 완료 처리한다.

rules:
  proposal:
    - 문서는 한글로 작성한다.
    - Why 첫 문장은 변경의 결론과 필요한 이유를 먼저 말하고, 배경 설명은 뒤에 둔다.
    - 짧은 문장과 짧은 문단으로 자연스러운 한국어를 사용한다.
    - What Changes에는 변경될 동작, 산출물, 검증 방식을 쓴다.
    - Impact에는 영향 범위, 바뀌지 않는 것, 운영/테스트 영향을 쓴다.
    - What Changes와 Impact에 같은 내용을 반복하지 않는다.
    - Capabilities에는 대기능_중기능_소기능 형식의 capability 이름을 사용한다.
    - 각 segment는 kebab-case로 작성한다.
  specs:
    - 문서는 한글로 작성한다.
    - proposal에서 정한 핵심 용어와 문제 정의, 문체를 이어받는다.
    - proposal에 제기된 문체/구조 피드백을 같은 change의 specs에도 적용한다.
    - spec directory name은 proposal의 capability 이름과 동일한 대기능_중기능_소기능 형식을 사용한다.
    - 각 requirement와 scenario는 검증 가능한 사용자 관찰 동작으로 작성한다.
  design:
    - 문서는 한글로 작성한다.
    - proposal에서 정한 핵심 용어와 문제 정의, 문체를 이어받는다.
    - proposal에 제기된 문체/구조 피드백을 같은 change의 design에도 적용한다.
    - 구현 세부 사항보다 결정 이유, trade-off, migration 관점을 명확히 작성한다.
  tasks:
    - 문서는 한글로 작성한다.
    - proposal에서 정한 핵심 용어와 문제 정의, 문체를 이어받는다.
    - proposal에 제기된 문체/구조 피드백을 같은 change의 tasks에도 적용한다.
    - 구현 task는 테스트 우선 순서로 작성한다.
    - task 완료 기준에는 구현 완료와 관련 테스트 통과를 포함한다.
