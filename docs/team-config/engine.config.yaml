schema: engine-spec-driven

context: |
  dynamic-engine 팀 OpenSpec 문서는 한글로 작성한다.
  command, code identifier, config key, path, OpenSpec parser keyword는 원문을 유지할 수 있다.
  구현 작업은 테스트 우선으로 진행하고, 테스트 의도와 기대 동작을 구현 전에 정리한다.
  테스트 목적/동작과 중요한 로직/함수에는 한글 주석을 작성한다.
  구현과 테스트 통과가 끝난 뒤에만 task를 완료 처리한다.

rules:
  proposal:
    - 문서는 한글로 작성한다.
    - Capabilities에는 major-feature_minor-feature_issue-name 형식의 capability 이름을 사용한다.
    - 각 segment는 kebab-case로 작성한다.
  specs:
    - 문서는 한글로 작성한다.
    - spec directory name은 proposal의 capability 이름과 동일한 major-feature_minor-feature_issue-name 형식을 사용한다.
    - 각 requirement와 scenario는 검증 가능한 사용자 관찰 동작으로 작성한다.
  design:
    - 문서는 한글로 작성한다.
    - 구현 세부 사항보다 결정 이유, trade-off, migration 관점을 명확히 작성한다.
  tasks:
    - 문서는 한글로 작성한다.
    - 구현 task는 테스트 우선 순서로 작성한다.
    - task 완료 기준에는 구현 완료와 관련 테스트 통과를 포함한다.
